name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to stage (e.g. v0.8.0)'
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          # Current Node for npm publish --provenance. Package engines remain >=20.
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm stage needs npm >= 11.15.0
      - run: npm install -g npm@^11.15.0 && npm --version
      - run: npm ci
      - run: npm run check:skill-pin
      - run: npm test
      - run: npm run build
      - run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm pack --ignore-scripts
      - run: node scripts/write-sha256sums.mjs ironheights-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: |
            SHA256SUMS
            ironheights-*.tgz
          if-no-files-found: error
  release-checksums:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: ${{ github.workspace }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            SHA256SUMS
            ironheights-*.tgz
      - name: Attach checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          notes="npm package staged with provenance (live after maintainer approval). Verify SHA256SUMS using docs/release-verification.md."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" SHA256SUMS ironheights-*.tgz --clobber
          else
            gh release create "$tag" SHA256SUMS ironheights-*.tgz --title "$tag" --notes "$notes"
          fi
