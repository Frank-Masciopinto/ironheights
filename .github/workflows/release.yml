name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to stage (e.g. v0.8.0)'
        required: true
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      # Validate the collaborator-supplied tag before any step uses it (OSPS-BR-01.04).
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::release tag must look like vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Current Node for npm publish --provenance. Package engines remain >=20.
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm stage needs npm >= 11.15.0. Installed from a committed lockfile
      # (exact version + integrity hash) so the toolchain is pinned.
      - run: npm ci --prefix .github/tools/npm-cli --ignore-scripts
      - run: echo "$GITHUB_WORKSPACE/.github/tools/npm-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm --version
      - run: npm ci
      - run: npm run check:skill-pin
      - run: npm test
      - run: npm run build
      # Skip when this version is already on npm (for example staged and approved from a
      # maintainer machine first). npm returns E409 for a second stage of the same version,
      # which used to fail the whole release run (v0.21.1, v0.22.0).
      - id: published
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "ironheights@$v" version >/dev/null 2>&1; then
            echo "ironheights@$v is already on npm; skipping npm stage publish"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm pack --ignore-scripts
      # CycloneDX SBOM of the runtime dependency tree, shipped with every release (OSPS-QA-02.02).
      - run: |
          v="$(node -p 'require("./package.json").version')"
          npm sbom --sbom-format cyclonedx --omit dev > "ironheights-$v.cdx.json"
      - run: node scripts/write-sha256sums.mjs ironheights-*.tgz ironheights-*.cdx.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: |
            SHA256SUMS
            ironheights-*.tgz
            ironheights-*.cdx.json
          if-no-files-found: error
  release-checksums:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: ${{ github.workspace }}
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            SHA256SUMS
            ironheights-*.tgz
            ironheights-*.cdx.json
      - name: Attach checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          tag="$TAG"
          # Signed SLSA provenance (Sigstore bundle) as a release asset.
          cp "$BUNDLE" "ironheights-${tag#v}.intoto.jsonl"
          notes="npm package staged with provenance (live after maintainer approval). Verify SHA256SUMS using docs/release-verification.md."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" SHA256SUMS ironheights-*.tgz ironheights-*.cdx.json ironheights-*.intoto.jsonl --clobber
          else
            gh release create "$tag" SHA256SUMS ironheights-*.tgz ironheights-*.cdx.json ironheights-*.intoto.jsonl --title "$tag" --notes "$notes"
          fi
