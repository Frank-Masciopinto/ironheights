name: benchmark badge
# Re-scores MaliciousSkillBench and the blind held-out set (Ironheights, the latest
# Cisco skill-scanner release, and NVIDIA SkillSpector at the commit in
# bench/msb/requirements-nvidia.txt) on each release tag, main merge and weekly, and
# publishes the README badge and comparison-table cells plus proof files (badges/proof/)
# as shields.io endpoint files on the `badges` branch. If any step fails, the
# publish job does not run and the last good badges/benchmark.json stays in place.
on:
  push:
    tags: ['v*']
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # weekly, Monday 05:17 UTC, picks up new Cisco releases
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-badge
  cancel-in-progress: false

jobs:
  score:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: 'python3 -m venv .venv && .venv/bin/pip install --require-hashes --only-binary=:all: -r bench/msb/requirements.txt -r bench/msb/requirements-cisco.txt'
      - name: Upgrade to the latest Cisco skill-scanner release
        # The hashed pin above is the floor; this moves Cisco to its newest PyPI release so the
        # table always compares against the current version (printed in PROOF.md).
        run: '.venv/bin/pip install --only-binary=:all: --upgrade cisco-ai-skill-scanner && .venv/bin/skill-scanner --version'
      - name: Install NVIDIA SkillSpector at the pinned commit
        # The git pin has no file hash (it is a commit). Dependencies are the hashed lock in
        # bench/msb/requirements-nvidia.txt. --only-binary refuses a source build.
        run: |
          set -euo pipefail
          pin="$(sed -n 's/.*SkillSpector\.git@\([0-9a-f]\{40\}\).*/\1/p' bench/msb/requirements-nvidia.txt)"
          test -n "$pin"
          .venv/bin/pip install --only-binary=:all: "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@${pin}"
          .venv/bin/skillspector --version
      - run: .venv/bin/python scripts/benchmark-msb.py dist/cli/index.js out .venv/bin/skill-scanner .venv/bin/skillspector
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-badge
          path: out/
          retention-days: 30

  publish:
    needs: score
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push badges/benchmark.json to the `badges` branch only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-badge
          path: out
      - name: Push endpoint JSON to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q badges && cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin badges; then git checkout -q -b badges FETCH_HEAD; else git checkout -q --orphan badges; fi
          mkdir -p badges
          test "$(ls ../out/table-*.json | wc -l)" -eq 21
          cp ../out/benchmark.json ../out/benchmark-summary.json ../out/table-*.json badges/
          # Proof that the run happened: per-skill results, blind aggregate, run link (README cells link here)
          mkdir -p badges/proof
          cp ../out/PROOF.md ../out/results.csv ../out/blind-aggregate.json ../out/benchmark-summary.json badges/proof/
          git add badges
          if git diff --cached --quiet; then echo "badge unchanged"; exit 0; fi
          git commit -q -m "benchmark badge: $(jq -r '.version + " " + .detect + " detect, " + .fp + " FP; cisco " + .cisco.detect + " detect, " + .cisco.fp + " FP; nvidia " + .nvidia.detect + " detect, " + .nvidia.fp + " FP"' badges/benchmark-summary.json)"
          git push -q origin HEAD:badges

  alert:
    # A failed run must be fixed, not ignored: open (or comment on) a tracking issue.
    # The workflow run itself is also red, and the old badge is left untouched.
    needs: [score, publish]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          title="Benchmark badge run failed"
          n="$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number -q '.[0].number')"
          body="The benchmark badge workflow failed for \`$REF\`: $RUN. The badge still shows the previous release's number until this is fixed."
          if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" -b "$body"; else gh issue create -R "$REPO" -t "$title" -b "$body"; fi
          echo "::error::benchmark badge run failed; see $RUN"
