name: action
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  benign:
    name: action benign fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        uses: ./
        with:
          # Pinned to the current npm latest.
          version: '0.23.0'
          path: test/fixtures/benign
      - name: Benign fixture passes
        shell: bash
        env:
          CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          if [[ "$CODE" != "0" ]]; then
            echo "expected exit 0, got $CODE"
            exit 1
          fi
  malicious:
    name: action malicious fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          # Pinned to the current npm latest.
          version: '0.23.0'
          path: test/fixtures/malicious/IH-CRED-001
          badge-file: ironheights-badge.json
      - name: Malicious fixture fails with a grade and a badge
        shell: bash
        env:
          CODE: ${{ steps.scan.outputs.exit-code }}
          GRADE: ${{ steps.scan.outputs.grade }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
        run: |
          if [[ "$CODE" != "1" && "$CODE" != "2" ]]; then
            echo "expected exit 1 or 2, got $CODE"
            exit 1
          fi
          if [[ ! "$GRADE" =~ ^[A-F]$ ]]; then
            echo "expected a letter grade, got '$GRADE'"
            exit 1
          fi
          if [[ "$VERDICT" != "review" && "$VERDICT" != "block" ]]; then
            echo "expected review or block, got '$VERDICT'"
            exit 1
          fi
          grep -q '"label": "ironheights"' ironheights-badge.json
  incomplete:
    name: action incomplete fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create an oversized skill file
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/padded-skill"
          dd if=/dev/zero of="$RUNNER_TEMP/padded-skill/payload.md" bs=1048576 count=2 status=none
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          # Pinned to the current npm latest.
          version: '0.23.0'
          path: ${{ runner.temp }}/padded-skill
      - name: Skipped file exits 3
        shell: bash
        env:
          CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          if [[ "$CODE" != "3" ]]; then
            echo "expected exit 3, got $CODE"
            exit 1
          fi
  threatmodel:
    name: action threat model example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tm
        uses: ./
        with:
          # Pinned to the current npm latest.
          version: '0.23.0'
          path: examples/threatmodel
          mode: threatmodel
          threatmodel-base: ''
          comment: 'false'
      - name: Example repo is inside its threat model
        shell: bash
        env:
          CODE: ${{ steps.tm.outputs.threatmodel-exit-code }}
        run: |
          if [[ "$CODE" != "0" ]]; then
            echo "expected exit 0, got $CODE"
            exit 1
          fi
