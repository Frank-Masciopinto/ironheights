name: agent threat model
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  threatmodel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Frank-Masciopinto/ironheights@v0.19.0
        with:
          version: '0.19.0'
          mode: both
